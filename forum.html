<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>论坛 - 宠物乐园</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/forum.css">
</head>
<body data-theme="pink">

<header class="header-area">
  <div class="header-dots"></div>
  <div class="header-content">
    <span class="header-title">论坛</span>
    <button class="post-btn" id="newPostBtn">✏️ 发帖</button>
  </div>
</header>
<div class="scallop-divider header-scallop"></div>

<main class="main-content">

  <!-- 帖子列表 -->
  <div class="post-list">
    <div class="post-card">
      <div class="post-header">
        <span class="post-avatar">🐱</span>
        <div class="post-meta">
          <span class="post-author">小猫咪的主人</span>
          <span class="post-time">3分钟前</span>
        </div>
      </div>
      <div class="post-body">
        <p class="post-text">今天孵出了一只超级可爱的小猫！金色的毛太好看了吧！</p>
        <div class="post-img-area">🐱✨</div>
      </div>
      <div class="post-footer">
        <button class="post-action">❤️ 12</button>
        <button class="post-action">💬 5</button>
      </div>
    </div>

    <div class="post-card">
      <div class="post-header">
        <span class="post-avatar">🐶</span>
        <div class="post-meta">
          <span class="post-author">汪汪爱好者</span>
          <span class="post-time">1小时前</span>
        </div>
      </div>
      <div class="post-body">
        <p class="post-text">请问传说蛋出货率大概多少啊？连开三个都是普通的...</p>
      </div>
      <div class="post-footer">
        <button class="post-action">❤️ 8</button>
        <button class="post-action">💬 23</button>
      </div>
    </div>

    <div class="post-card">
      <div class="post-header">
        <span class="post-avatar">🐰</span>
        <div class="post-meta">
          <span class="post-author">兔兔养殖户</span>
          <span class="post-time">3小时前</span>
        </div>
      </div>
      <div class="post-body">
        <p class="post-text">我的兔子进化了！从幼体直接变成了成熟期，好快！</p>
      </div>
      <div class="post-footer">
        <button class="post-action">❤️ 31</button>
        <button class="post-action">💬 9</button>
      </div>
    </div>
  </div>

</main>

<div class="scallop-divider dock-scallop"></div>
<nav class="dock">
  <div class="dock-dots"></div>
  <a href="index.html" class="dock-item"><span class="dock-icon">🏠</span><span class="dock-label">主页</span></a>
  <a href="hatch.html" class="dock-item"><span class="dock-icon">🥚</span><span class="dock-label">孵蛋</span></a>
  <a href="forum.html" class="dock-item active"><span class="dock-icon">💬</span><span class="dock-label">论坛</span></a>
  <a href="shop.html" class="dock-item"><span class="dock-icon">🛍️</span><span class="dock-label">商店</span></a>
  <a href="mine.html" class="dock-item"><span class="dock-icon">😊</span><span class="dock-label">我的</span></a>
</nav>

<script src="js/theme.js"></script>
</body>
</html>
