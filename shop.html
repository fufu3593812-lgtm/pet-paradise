<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shop - Dot Diary</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/shop.css">
</head>
<body data-theme="pink">

<div class="dots-bg"></div>

<header class="page-bar">
  <button class="back-btn" onclick="history.back()">←</button>
  <div class="page-title">• Shop •</div>
  <button class="page-action">🛒</button>
</header>

<div class="wave-divider top"></div>

<main class="shop-main">

  <!-- Tabs -->
  <div class="shop-tabs">
    <button class="shop-tab active"><span class="tab-dot"></span>NEW</button>
    <button class="shop-tab"><span class="tab-dot"></span>HOT</button>
    <button class="shop-tab"><span class="tab-dot"></span>LIMITED</button>
    <button class="shop-tab"><span class="tab-dot"></span>ALL</button>
  </div>

  <!-- Product grid -->
  <div class="product-grid">
    <div class="product-card">
      <span class="product-badge new">NEW</span>
      <div class="product-img">🎀</div>
      <div class="product-info">
        <span class="product-name">Pink Dot Beret</span>
        <div class="product-bottom">
          <span class="product-price"><span class="price-dot"></span>300</span>
          <button class="fav-btn">♡</button>
        </div>
      </div>
    </div>
    <div class="product-card">
      <span class="product-badge hot">HOT</span>
      <div class="product-img">👚</div>
      <div class="product-info">
        <span class="product-name">Dot Shirt</span>
        <div class="product-bottom">
          <span class="product-price"><span class="price-dot"></span>330</span>
          <button class="fav-btn">♡</button>
        </div>
      </div>
    </div>
    <div class="product-card">
      <span class="product-badge limited">LIMITED</span>
      <div class="product-img">🛋️</div>
      <div class="product-info">
        <span class="product-name">Dot Cushion</span>
        <div class="product-bottom">
          <span class="product-price"><span class="price-dot"></span>450</span>
          <button class="fav-btn">♡</button>
        </div>
      </div>
    </div>
    <div class="product-card">
      <div class="product-img">🎒</div>
      <div class="product-info">
        <span class="product-name">Dot Backpack</span>
        <div class="product-bottom">
          <span class="product-price"><span class="price-dot"></span>520</span>
          <button class="fav-btn">♡</button>
        </div>
      </div>
    </div>
  </div>

</main>

<nav class="dock">
  <a href="index.html" class="dock-item"><span class="dock-icon">🏠</span><span class="dock-dot"></span><span class="dock-label">Home</span></a>
  <a href="pet.html" class="dock-item"><span class="dock-icon">🐾</span><span class="dock-dot"></span><span class="dock-label">Pet</span></a>
  <a href="shop.html" class="dock-item active"><span class="dock-icon">🛍️</span><span class="dock-dot"></span><span class="dock-label">Shop</span></a>
  <a href="bag.html" class="dock-item"><span class="dock-icon">👜</span><span class="dock-dot"></span><span class="dock-label">Bag</span></a>
  <a href="mine.html" class="dock-item"><span class="dock-icon">😊</span><span class="dock-dot"></span><span class="dock-label">Mine</span></a>
</nav>

<script src="js/theme.js"></script>
</body>
</html>
