<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>商店 - 宠物乐园</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/shop.css">
</head>
<body data-theme="pink">

<header class="header-area">
  <div class="header-dots"></div>
  <div class="header-content">
    <span class="header-title">商店</span>
    <span class="header-coin">💎 1320</span>
  </div>
</header>
<div class="wave-border"></div>

<main class="main-content">

  <!-- 分类标签 -->
  <div class="shop-tabs">
    <button class="shop-tab active">全部</button>
    <button class="shop-tab">食物</button>
    <button class="shop-tab">玩具</button>
    <button class="shop-tab">装饰</button>
    <button class="shop-tab">道具</button>
  </div>

  <!-- 商品列表 -->
  <div class="shop-grid">
    <div class="shop-item">
      <div class="shop-item-img">🍖</div>
      <span class="shop-item-name">高级狗粮</span>
      <span class="shop-item-price">💎 20</span>
      <button class="shop-buy-btn">购买</button>
    </div>
    <div class="shop-item">
      <div class="shop-item-img">🥛</div>
      <span class="shop-item-name">鲜牛奶</span>
      <span class="shop-item-price">💎 15</span>
      <button class="shop-buy-btn">购买</button>
    </div>
    <div class="shop-item">
      <div class="shop-item-img">🎾</div>
      <span class="shop-item-name">弹力球</span>
      <span class="shop-item-price">💎 30</span>
      <button class="shop-buy-btn">购买</button>
    </div>
    <div class="shop-item">
      <div class="shop-item-img">🎀</div>
      <span class="shop-item-name">蝴蝶结</span>
      <span class="shop-item-price">💎 50</span>
      <button class="shop-buy-btn">购买</button>
    </div>
    <div class="shop-item">
      <div class="shop-item-img">🧴</div>
      <span class="shop-item-name">沐浴露</span>
      <span class="shop-item-price">💎 25</span>
      <button class="shop-buy-btn">购买</button>
    </div>
    <div class="shop-item">
      <div class="shop-item-img">🛏️</div>
      <span class="shop-item-name">软垫窝</span>
      <span class="shop-item-price">💎 120</span>
      <button class="shop-buy-btn">购买</button>
    </div>
  </div>

</main>

<div class="wave-border dock-wave"></div>
<nav class="dock">
  <div class="dock-dots"></div>
  <a href="index.html" class="dock-item"><span class="dock-icon">🏠</span><span class="dock-label">主页</span></a>
  <a href="hatch.html" class="dock-item"><span class="dock-icon">🥚</span><span class="dock-label">孵蛋</span></a>
  <a href="forum.html" class="dock-item"><span class="dock-icon">💬</span><span class="dock-label">论坛</span></a>
  <a href="shop.html" class="dock-item active"><span class="dock-icon">🛍️</span><span class="dock-label">商店</span></a>
  <a href="mine.html" class="dock-item"><span class="dock-icon">😊</span><span class="dock-label">我的</span></a>
</nav>

<script src="js/theme.js"></script>
</body>
</html>
