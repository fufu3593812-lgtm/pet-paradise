<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>商店 - 宠物乐园</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/shop.css">
</head>
<body data-theme="pink">

<div class="polka-bg"></div>

<div class="content-frame">
  <div class="bow bow-top-left"></div>
  <div class="bow bow-top-right"></div>
  <div class="corner-dot"></div>

  <header class="page-header">
    <span class="header-title">商店</span>
    <span class="header-coin">💎 1320</span>
  </header>

  <div class="lace-divider"></div>

  <!-- 分类 -->
  <div class="shop-tabs">
    <button class="shop-tab active">全部</button>
    <button class="shop-tab">食物</button>
    <button class="shop-tab">玩具</button>
    <button class="shop-tab">装饰</button>
  </div>

  <!-- 商品 -->
  <div class="shop-grid">
    <div class="shop-item">
      <div class="shop-img">🍖</div>
      <span class="shop-name">高级狗粮</span>
      <span class="shop-price">💎 20</span>
    </div>
    <div class="shop-item">
      <div class="shop-img">🥛</div>
      <span class="shop-name">鲜牛奶</span>
      <span class="shop-price">💎 15</span>
    </div>
    <div class="shop-item">
      <div class="shop-img">🎾</div>
      <span class="shop-name">弹力球</span>
      <span class="shop-price">💎 30</span>
    </div>
    <div class="shop-item">
      <div class="shop-img">🎀</div>
      <span class="shop-name">蝴蝶结</span>
      <span class="shop-price">💎 50</span>
    </div>
    <div class="shop-item">
      <div class="shop-img">🧴</div>
      <span class="shop-name">沐浴露</span>
      <span class="shop-price">💎 25</span>
    </div>
    <div class="shop-item">
      <div class="shop-img">🛏️</div>
      <span class="shop-name">软垫窝</span>
      <span class="shop-price">💎 120</span>
    </div>
  </div>

</div>

<nav class="dock">
  <a href="index.html" class="dock-item"><span class="dock-icon">🏠</span><span class="dock-label">主页</span></a>
  <a href="hatch.html" class="dock-item"><span class="dock-icon">🥚</span><span class="dock-label">孵蛋</span></a>

  <a href="shop.html" class="dock-item active"><span class="dock-icon">🛍️</span><span class="dock-label">商店</span></a>
  <a href="mine.html" class="dock-item"><span class="dock-icon">😊</span><span class="dock-label">我的</span></a>
</nav>

<script src="js/theme.js"></script>
</body>
</html>
