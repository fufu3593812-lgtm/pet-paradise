<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pet List - Dot Diary</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/petlist.css">
</head>
<body data-theme="pink">

<div class="dots-bg"></div>

<header class="page-bar">
  <button class="back-btn" onclick="history.back()">←</button>
  <div class="page-title">• Pet List •</div>
  <button class="page-action">＋</button>
</header>

<div class="wave-divider top"></div>

<main class="petlist-main">

  <div class="pet-grid">
    <div class="pet-card active">
      <span class="pet-card-check">✓</span>
      <div class="pet-card-img">🐩</div>
      <span class="pet-card-name">Bichon</span>
      <span class="pet-card-level"><span class="level-dot"></span>Lv.12</span>
    </div>
    <div class="pet-card">
      <div class="pet-card-img">🐕</div>
      <span class="pet-card-name">Poodle</span>
      <span class="pet-card-level"><span class="level-dot"></span>Lv.8</span>
    </div>
    <div class="pet-card">
      <div class="pet-card-img">🐱</div>
      <span class="pet-card-name">Kitty</span>
      <span class="pet-card-level"><span class="level-dot"></span>Lv.5</span>
    </div>
    <div class="pet-card locked">
      <div class="pet-card-lock">🔒</div>
      <div class="pet-card-img">🐰</div>
      <span class="pet-card-name">Bunny</span>
      <span class="pet-card-level"><span class="level-dot"></span>Lv.3</span>
    </div>
  </div>

  <!-- Page dots -->
  <div class="page-dots">
    <span class="dot active"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>

</main>

<nav class="dock">
  <a href="index.html" class="dock-item"><span class="dock-icon">🏠</span><span class="dock-dot"></span><span class="dock-label">Home</span></a>
  <a href="pet.html" class="dock-item active"><span class="dock-icon">🐾</span><span class="dock-dot"></span><span class="dock-label">Pet</span></a>
  <a href="shop.html" class="dock-item"><span class="dock-icon">🛍️</span><span class="dock-dot"></span><span class="dock-label">Shop</span></a>
  <a href="bag.html" class="dock-item"><span class="dock-icon">👜</span><span class="dock-dot"></span><span class="dock-label">Bag</span></a>
  <a href="mine.html" class="dock-item"><span class="dock-icon">😊</span><span class="dock-dot"></span><span class="dock-label">Mine</span></a>
</nav>

<script src="js/theme.js"></script>
</body>
</html>
