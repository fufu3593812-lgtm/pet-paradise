<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>孵蛋 - 宠物乐园</title>
<link rel="stylesheet" href="css/base.css">

<body>

<div class="dot-bg"></div>

<header class="page-top">
  <button class="back-btn" onclick="history.back()">←</button>
  <span class="page-title">盲盒孵蛋</span>
  <span class="page-coin">💎 1320</span>
</header>

<main class="page-body">

  <section class="egg-grid">
    <div class="egg-card">
      <div class="egg-icon">🥚</div>
      <div class="egg-meta">
        <span class="egg-tier">普通蛋</span>
        <span class="egg-desc">常见宠物为主</span>
      </div>
      <button class="egg-buy">💎 100</button>
    </div>
    <div class="egg-card">
      <div class="egg-icon">🪺</div>
      <div class="egg-meta">
        <span class="egg-tier">精良蛋</span>
        <span class="egg-desc">稀有概率提升</span>
      </div>
      <button class="egg-buy">💎 300</button>
    </div>
    <div class="egg-card">
      <div class="egg-icon">✨🥚</div>
      <div class="egg-meta">
        <span class="egg-tier">传说蛋</span>
        <span class="egg-desc">必出稀有以上</span>
      </div>
      <button class="egg-buy">💎 800</button>
    </div>
  </section>

  <section class="hatch-section">
    <h3 class="section-title">孵化中</h3>
    <div class="hatch-card">
      <span class="hatch-emoji">🥚</span>
      <div class="hatch-detail">
        <span class="hatch-name">普通蛋 #1</span>
        <div class="hatch-bar"><div class="hatch-fill" style="width:65%"></div></div>
        <span class="hatch-time">剩余 2小时30分</span>
      </div>
    </div>
  </section>

</main>
