<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>孵蛋 - 宠物乐园</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/hatch.css">
</head>
<body data-theme="pink">

<div class="polka-bg"></div>

<div class="content-frame">
  <div class="bow bow-top-left"></div>
  <div class="bow bow-top-right"></div>
  <div class="bow bow-bottom-left"></div>
  <div class="corner-dot"></div>

  <header class="page-header">
    <span class="header-title">盲盒孵蛋</span>
    <span class="header-coin">💎 1320</span>
  </header>

  <div class="lace-divider"></div>

  <!-- 三档蛋 -->
  <section class="egg-list">
    <div class="egg-card">
      <div class="egg-icon">🥚</div>
      <div class="egg-info">
        <span class="egg-tier">普通蛋</span>
        <span class="egg-desc">常见宠物为主</span>
      </div>
      <div class="egg-right">
        <span class="egg-price">💎 100</span>
        <button class="egg-btn">孵化</button>
      </div>
    </div>
    <div class="egg-card">
      <div class="egg-icon">🪺</div>
      <div class="egg-info">
        <span class="egg-tier">精良蛋</span>
        <span class="egg-desc">稀有概率提升</span>
      </div>
      <div class="egg-right">
        <span class="egg-price">💎 300</span>
        <button class="egg-btn">孵化</button>
      </div>
    </div>
    <div class="egg-card">
      <div class="egg-icon">✨🥚</div>
      <div class="egg-info">
        <span class="egg-tier">传说蛋</span>
        <span class="egg-desc">必出稀有以上</span>
      </div>
      <div class="egg-right">
        <span class="egg-price">💎 800</span>
        <button class="egg-btn">孵化</button>
      </div>
    </div>
  </section>

  <div class="lace-divider"></div>

  <!-- 孵化中 -->
  <section class="hatching-section">
    <div class="section-label">孵化中</div>
    <div class="hatch-slot">
      <div class="hatch-egg">🥚</div>
      <div class="hatch-info">
        <span class="hatch-name">普通蛋 #1</span>
        <div class="hatch-bar"><div class="hatch-fill" style="width:65%"></div></div>
        <span class="hatch-time">剩余 2小时30分</span>
      </div>
    </div>
  </section>

</div>

<nav class="dock">
  <a href="index.html" class="dock-item"><span class="dock-icon">🏠</span><span class="dock-label">主页</span></a>
  <a href="hatch.html" class="dock-item active"><span class="dock-icon">🥚</span><span class="dock-label">孵蛋</span></a>
  <a href="forum.html" class="dock-item"><span class="dock-icon">💬</span><span class="dock-label">论坛</span></a>
  <a href="shop.html" class="dock-item"><span class="dock-icon">🛍️</span><span class="dock-label">商店</span></a>
  <a href="mine.html" class="dock-item"><span class="dock-icon">😊</span><span class="dock-label">我的</span></a>
</nav>

<script src="js/theme.js"></script>
</body>
</html>
