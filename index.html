<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>宠物乐园</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/home.css">
</head>
<body data-theme="pink">

<!-- 顶部波点区 -->
<header class="header-area">
  <div class="header-dots"></div>
  <div class="header-content">
    <span class="header-title">宠物乐园</span>
    <span class="header-coin">💎 1320</span>
  </div>
</header>
<div class="scallop-divider header-scallop"></div>

<!-- 主体内容 -->
<main class="main-content">

  <!-- 宠物展示区 -->
  <section class="pet-stage">
    <div class="pet-frame">
      <div class="pet-img">🐕</div>
    </div>
    <div class="pet-name-tag">小奶糖 · Lv.12</div>
  </section>

  <!-- 状态条 -->
  <section class="status-card">
    <div class="status-item">
      <span class="status-label">心情</span>
      <div class="status-bar"><div class="status-fill" style="width:80%"></div></div>
      <span class="status-num">80</span>
    </div>
    <div class="status-item">
      <span class="status-label">饱食</span>
      <div class="status-bar"><div class="status-fill" style="width:60%"></div></div>
      <span class="status-num">60</span>
    </div>
    <div class="status-item">
      <span class="status-label">清洁</span>
      <div class="status-bar"><div class="status-fill" style="width:45%"></div></div>
      <span class="status-num">45</span>
    </div>
  </section>

  <!-- 互动按钮 -->
  <section class="action-row">
    <button class="action-btn">🍖 喂食</button>
    <button class="action-btn">🎾 玩耍</button>
    <button class="action-btn">🛁 洗澡</button>
    <button class="action-btn">😴 休息</button>
  </section>

</main>

<!-- 底部波浪 + dock -->
<div class="scallop-divider dock-scallop"></div>
<nav class="dock">
  <div class="dock-dots"></div>
  <a href="index.html" class="dock-item active"><span class="dock-icon">🏠</span><span class="dock-label">主页</span></a>
  <a href="hatch.html" class="dock-item"><span class="dock-icon">🥚</span><span class="dock-label">孵蛋</span></a>
  <a href="forum.html" class="dock-item"><span class="dock-icon">💬</span><span class="dock-label">论坛</span></a>
  <a href="shop.html" class="dock-item"><span class="dock-icon">🛍️</span><span class="dock-label">商店</span></a>
  <a href="mine.html" class="dock-item"><span class="dock-icon">😊</span><span class="dock-label">我的</span></a>
</nav>

<script src="js/theme.js"></script>
</body>
</html>
