<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>宠物乐园</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/home.css">
</head>
<body>

<!-- 波点背景 -->
<div class="dot-bg"></div>

<!-- 顶部 -->
<header class="top-section">
  <div class="avatar-area">
    <div class="avatar">
      <span class="avatar-emoji">🐶</span>
    </div>
    <div class="avatar-info">
      <span class="pet-name">小奶糖</span>
      <div class="intimacy-tag">♡ Lv.12 ›</div>
    </div>
  </div>
  <div class="top-btns">
    <button class="top-circle-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </button>
    <button class="top-circle-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    </button>
  </div>
</header>

<!-- 宠物卡片（只放宠物） -->
<section class="pet-card">
  <div class="pet-card-lace">
    <svg width="100%" height="20" preserveAspectRatio="none" viewBox="0 0 400 20">
      <path d="M0,20 C8,20 12,4 20,4 C28,4 32,20 40,20 C48,20 52,4 60,4 C68,4 72,20 80,20 C88,20 92,4 100,4 C108,4 112,20 120,20 C128,20 132,4 140,4 C148,4 152,20 160,20 C168,20 172,4 180,4 C188,4 192,20 200,20 C208,20 212,4 220,4 C228,4 232,20 240,20 C248,20 252,4 260,4 C268,4 272,20 280,20 C288,20 292,4 300,4 C308,4 312,20 320,20 C328,20 332,4 340,4 C348,4 352,20 360,20 C368,20 372,4 380,4 C388,4 392,20 400,20" fill="none" stroke="#DADADA" stroke-width="1.2"/>
    </svg>
  </div>
  <div class="pet-card-body">
    <div class="pet-big">🐶</div>
  </div>
</section>

<!-- 操作按钮（卡片下方） -->
<section class="action-row">
  <button class="action-card">
    <span class="action-icon">⬆️</span>
    <span class="action-label">升级</span>
  </button>
  <button class="action-card">
    <span class="action-icon">👋</span>
    <span class="action-label">抚摸</span>
  </button>
  <button class="action-card">
    <span class="action-icon">🚶</span>
    <span class="action-label">跟随</span>
  </button>
</section>

<!-- 数值条（按钮下方） -->
<section class="stat-section">
  <div class="stat-item">
    <span class="stat-label">战力</span>
    <div class="stat-bar"><div class="stat-fill dark" style="width:72%"></div></div>
    <span class="stat-val">360</span>
  </div>
  <div class="stat-item">
    <span class="stat-label">心情</span>
    <div class="stat-bar"><div class="stat-fill purple" style="width:85%"></div></div>
    <span class="stat-val">85</span>
  </div>
  <div class="stat-item">
    <span class="stat-label">饱食</span>
    <div class="stat-bar"><div class="stat-fill purple" style="width:60%"></div></div>
    <span class="stat-val">60</span>
  </div>
  <div class="stat-item">
    <span class="stat-label">清洁</span>
    <div class="stat-bar"><div class="stat-fill dark" style="width:45%"></div></div>
    <span class="stat-val">45</span>
  </div>
</section>

<!-- 底部Dock -->
<nav class="dock">
  <a href="index.html" class="dock-item active">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><path d="M9 21V13h6v8"/></svg>
    <span>主页</span>
  </a>
  <a href="hatch.html" class="dock-item">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="12" cy="13" rx="7" ry="9"/><path d="M12 4 C10 4 8 6 9 8"/></svg>
    <span>孵蛋</span>
  </a>
  <a href="forum.html" class="dock-item">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10z"/></svg>
    <span>论坛</span>
  </a>
  <a href="shop.html" class="dock-item">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
    <span>商店</span>
  </a>
  <a href="mine.html" class="dock-item">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span>我的</span>
  </a>
</nav>

<script src="js/theme.js"></script>
</body>
</html>
