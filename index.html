<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>宠物乐园</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/home.css">
</head>
<body>

<!-- 波点背景 -->
<div class="dot-bg"></div>

<!-- 顶部信息 -->
<header class="top-section">
  <div class="avatar-area">
    <div class="avatar">
      <span class="avatar-emoji">🐶</span>
    </div>
    <div class="avatar-info">
      <span class="pet-name">小奶糖 <span class="edit-icon">✎</span></span>
      <div class="intimacy-tag">♡ 亲密度 520 ›</div>
    </div>
  </div>
  <div class="top-btns">
    <button class="top-circle-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </button>
    <button class="top-circle-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    </button>
  </div>
</header>

<!-- 主卡片（带蒸丝装饰） -->
<section class="main-card">
  <!-- 蒸丝装饰线 -->
  <div class="lace-top">
    <svg width="100%" height="18" preserveAspectRatio="none" viewBox="0 0 400 18">
      <path d="M0,18 C10,18 10,6 20,6 C30,6 30,18 40,18 C50,18 50,6 60,6 C70,6 70,18 80,18 C90,18 90,6 100,6 C110,6 110,18 120,18 C130,18 130,6 140,6 C150,6 150,18 160,18 C170,18 170,6 180,6 C190,6 190,18 200,18 C210,18 210,6 220,6 C230,6 230,18 240,18 C250,18 250,6 260,6 C270,6 270,18 280,18 C290,18 290,6 300,6 C310,6 310,18 320,18 C330,18 330,6 340,6 C350,6 350,18 360,18 C370,18 370,6 380,6 C390,6 390,18 400,18" fill="none" stroke="#E8E0E4" stroke-width="1"/>
    </svg>
  </div>
  <div class="main-card-inner">
    <div class="pet-display">
      <div class="pet-big">🐕</div>
    </div>
    <div class="pet-status-row">
      <div class="stat-item">
        <span class="stat-label">心情</span>
        <div class="stat-bar"><div class="stat-fill" style="width:80%"></div></div>
      </div>
      <div class="stat-item">
        <span class="stat-label">饱食</span>
        <div class="stat-bar"><div class="stat-fill" style="width:60%"></div></div>
      </div>
      <div class="stat-item">
        <span class="stat-label">清洁</span>
        <div class="stat-bar"><div class="stat-fill" style="width:45%"></div></div>
      </div>
    </div>
    <div class="pet-actions">
      <button class="pet-act-btn">🍖 喂食</button>
      <button class="pet-act-btn">🎾 玩耍</button>
      <button class="pet-act-btn">🛁 洗澡</button>
      <button class="pet-act-btn">😴 休息</button>
    </div>
  </div>
</section>

<!-- 双卡片行 -->
<section class="card-row">
  <div class="info-card">
    <div class="info-card-head">
      <span class="info-title">孵蛋进度</span>
    </div>
    <span class="info-sub">普通蛋 #1</span>
    <div class="info-progress"><div class="info-progress-fill" style="width:65%"></div></div>
    <span class="info-percent">65%</span>
  </div>
  <div class="info-card">
    <div class="info-card-head">
      <span class="info-title">限时活动</span>
    </div>
    <span class="info-sub">丛林冒险</span>
    <div class="countdown">剩余 <b>05</b> : <b>12</b> : <b>30</b></div>
  </div>
</section>

<!-- 底部Dock -->
<nav class="dock">
  <a href="index.html" class="dock-item active">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><path d="M9 21V13h6v8"/></svg>
    <span>主页</span>
  </a>
  <a href="forum.html" class="dock-item">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10z"/></svg>
    <span>论坛</span>
  </a>
  <a href="hatch.html" class="dock-item">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="12" cy="13" rx="7" ry="9"/><path d="M12 4 C10 4 8 6 9 8"/></svg>
    <span>孵蛋</span>
  </a>
  <a href="shop.html" class="dock-item">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
    <span>商店</span>
  </a>
  <a href="mine.html" class="dock-item">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span>我的</span>
  </a>
</nav>

<script src="js/theme.js"></script>
</body>
</html>
