<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pet Paradise</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/home.css">
</head>
<body data-theme="mint">
<div class="dots-bg"></div>
<header class="top-bar">
  <div class="logo">Pet Paradise</div>
  <button class="theme-btn" onclick="cycleTheme()" aria-label="切换主题">🎨</button>
</header>
<main class="home">
  <section class="greeting">
    <h1 class="greeting-text">早上好 ☀️</h1>
    <p class="greeting-sub">你的小家伙们在等你</p>
  </section>
  <section class="pet-slots">
    <div class="slot occupied" onclick="location.href='pet.html?id=0'">
      <div class="slot-img"><div class="placeholder-pet">🥚</div></div>
      <div class="slot-info">
        <span class="pet-name">未命名</span>
        <span class="pet-stage">蛋</span>
      </div>
      <div class="slot-progress"><div class="progress-bar" style="width:30%"></div></div>
    </div>
    <div class="slot empty" onclick="location.href='hatch.html'">
      <div class="slot-add">+</div>
      <span class="slot-label">孵化新蛋</span>
    </div>
  </section>
  <nav class="quick-nav">
    <a href="hatch.html" class="nav-card">
      <span class="nav-icon">🎁</span>
      <span class="nav-text">盲盒孵蛋</span>
    </a>
    <a href="forum.html" class="nav-card">
      <span class="nav-icon">💬</span>
      <span class="nav-text">社区</span>
    </a>
    <a href="#" class="nav-card">
      <span class="nav-icon">📦</span>
      <span class="nav-text">背包</span>
    </a>
  </nav>
</main>
<nav class="dock">
  <a href="index.html" class="dock-item active"><span class="dock-icon">🏠</span><span class="dock-label">主页</span></a>
  <a href="hatch.html" class="dock-item"><span class="dock-icon">🥚</span><span class="dock-label">孵蛋</span></a>
  <a href="forum.html" class="dock-item"><span class="dock-icon">💬</span><span class="dock-label">社区</span></a>
  <a href="settings.html" class="dock-item"><span class="dock-icon">⚙️</span><span class="dock-label">设置</span></a>
</nav>
<script src="js/theme.js"></script>
</body>
</html>
