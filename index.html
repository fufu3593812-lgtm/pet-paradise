<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>宠物乐园</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/home.css">
</head>
<body>

<!-- 波点背景 -->
<div class="dot-bg"></div>

<!-- 顶部 -->
<header class="top-section">
  <div class="avatar-area">
    <div class="avatar">
      <img src="assets/pets/开心火焰狗.png" alt="火焰狗" class="avatar-img">
    </div>
    <div class="avatar-info">
      <span class="pet-name">小奶糖 ✎</span>
      <div class="intimacy-tag">♡ 亲密度 520 ›</div>
    </div>
  </div>
  <div class="top-btns">
    <button class="top-circle-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </button>
    <button class="top-circle-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    </button>
  </div>
</header>

<!-- 宠物展示（虚线圆角卡片） -->
<section class="outer-card">
  <div class="outer-card-inner">
    <div class="pet-card-body">
      <img src="assets/pets/开心火焰狗.png" alt="开心火焰狗" class="pet-img">
    </div>
  </div>
</section>

<!-- 操作按钮（波点填充，紫白/黑白交替） -->
<section class="action-row">
  <button class="action-card purple-dot">
    <span class="action-label">升级</span>
  </button>
  <button class="action-card dark-dot">
    <span class="action-label">抚摸</span>
  </button>
  <button class="action-card purple-dot">
    <span class="action-label">跟随</span>
  </button>
</section>

<!-- 数值条 -->
<section class="stat-section">
  <div class="stat-section-inner">
    <div class="stat-item">
      <span class="stat-label">等级</span>
      <div class="stat-bar"><div class="stat-fill purple" style="width:72%"></div></div>
      <span class="stat-val">Lv.7</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">心情</span>
      <div class="stat-bar"><div class="stat-fill dark" style="width:85%"></div></div>
      <span class="stat-val">85</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">饱食</span>
      <div class="stat-bar"><div class="stat-fill purple" style="width:60%"></div></div>
      <span class="stat-val">60</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">战力</span>
      <div class="stat-bar"><div class="stat-fill dark" style="width:45%"></div></div>
      <span class="stat-val">360</span>
    </div>
  </div>
</section>

<!-- 主题切换 -->
<section class="theme-switcher">
  <div class="c-dot active" data-theme="default" onclick="setTheme('default')"></div>
  <div class="c-dot" data-theme="yellow" onclick="setTheme('yellow')"></div>
  <div class="c-dot" data-theme="pink" onclick="setTheme('pink')"></div>
  <div class="c-dot" data-theme="mint" onclick="setTheme('mint')"></div>
</section>

<!-- 底部Dock -->
<nav class="dock">
  <a href="index.html" class="dock-item active">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><path d="M9 21V13h6v8"/></svg>
    <span>主页</span>
  </a>
  <a href="hatch.html" class="dock-item">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="12" cy="13" rx="7" ry="9"/><path d="M12 4 C10 4 8 6 9 8"/></svg>
    <span>孵蛋</span>
  </a>
  <a href="forum.html" class="dock-item">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10z"/></svg>
    <span>论坛</span>
  </a>
  <a href="shop.html" class="dock-item">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
    <span>商店</span>
  </a>
  <a href="mine.html" class="dock-item">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span>我的</span>
  </a>
</nav>

<script src="js/theme.js"></script>
</body>
</html>
