<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的 - 宠物乐园</title>
<link rel="stylesheet" href="css/base.css">

</head>
<body>

<div class="dot-bg"></div>

<header class="page-top">
  <button class="back-btn" onclick="history.back()">←</button>
  <span class="page-title">我的</span>
  <span></span>
</header>

<main class="page-body">

  <section class="profile-card">
    <div class="profile-avatar">😊</div>
    <div class="profile-info">
      <span class="profile-name">服服</span>
      <span class="profile-id">ID: 001</span>
    </div>
    <span class="profile-coin">💎 1320</span>
  </section>

  <section class="mine-card">
    <h3 class="m-title">我的宠物</h3>
    <div class="m-pet-row">
      <span>🐕</span>
      <span class="m-pet-name">小奶糖</span>
      <span class="m-pet-lv">Lv.12</span>
    </div>
    <div class="m-pet-row">
      <span>🐱</span>
      <span class="m-pet-name">咪咪</span>
      <span class="m-pet-lv">Lv.5</span>
    </div>
  </section>

  <section class="mine-card">
    <h3 class="m-title">背包</h3>
    <div class="bag-row">
      <div class="bag-cell"><span>🍖</span><small>x12</small></div>
      <div class="bag-cell"><span>🥛</span><small>x8</small></div>
      <div class="bag-cell"><span>🎾</span><small>x5</small></div>
      <div class="bag-cell"><span>🎀</span><small>x3</small></div>
      <div class="bag-cell"><span>🧴</span><small>x6</small></div>
    </div>
  </section>

  <section class="mine-card">
    <h3 class="m-title">主题色</h3>
    <div class="color-row">
      <button class="c-dot lavender active" data-theme="default"></button>
      <button class="c-dot rose" data-theme="rose"></button>
      <button class="c-dot sky" data-theme="sky"></button>
      <button class="c-dot sage" data-theme="sage"></button>
      <button class="c-dot dark" data-theme="dark"></button>
    </div>
  </section>

</main>
