<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的 - 宠物乐园</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/mine.css">
</head>
<body data-theme="pink">

<div class="polka-bg"></div>

<div class="content-frame">
  <div class="bow bow-top-left"></div>
  <div class="bow bow-top-right"></div>
  <div class="corner-dot"></div>

  <header class="page-header">
    <span class="header-title">我的</span>
  </header>

  <div class="lace-divider"></div>

  <!-- 用户信息 -->
  <section class="user-info">
    <div class="user-avatar">😊</div>
    <div class="user-detail">
      <span class="user-name">服服</span>
      <span class="user-id">ID: 001</span>
    </div>
    <span class="user-coin">💎 1320</span>
  </section>

  <div class="lace-divider"></div>

  <!-- 我的宠物 -->
  <section>
    <div class="section-label">我的宠物</div>
    <div class="pet-list">
      <div class="pet-row">
        <span class="pet-row-icon">🐕</span>
        <span class="pet-row-name">小奶糖</span>
        <span class="pet-row-lv">Lv.12</span>
      </div>
      <div class="pet-row">
        <span class="pet-row-icon">🐱</span>
        <span class="pet-row-name">咪咪</span>
        <span class="pet-row-lv">Lv.5</span>
      </div>
    </div>
  </section>

  <div class="lace-divider"></div>

  <!-- 背包 -->
  <section>
    <div class="section-label">背包</div>
    <div class="bag-grid">
      <div class="bag-cell"><span>🍖</span><small>x12</small></div>
      <div class="bag-cell"><span>🥛</span><small>x8</small></div>
      <div class="bag-cell"><span>🎾</span><small>x5</small></div>
      <div class="bag-cell"><span>🎀</span><small>x3</small></div>
      <div class="bag-cell"><span>🧴</span><small>x6</small></div>
    </div>
  </section>

  <div class="lace-divider"></div>

  <!-- 主题 -->
  <section>
    <div class="section-label">主题色</div>
    <div class="theme-dots">
      <button class="t-dot pink active" data-theme="pink"></button>
      <button class="t-dot blue" data-theme="blue"></button>
      <button class="t-dot mint" data-theme="mint"></button>
      <button class="t-dot red" data-theme="red"></button>
      <button class="t-dot purple" data-theme="purple"></button>
      <button class="t-dot black" data-theme="black"></button>
    </div>
  </section>

</div>

<nav class="dock">
  <a href="index.html" class="dock-item"><span class="dock-icon">🏠</span><span class="dock-label">主页</span></a>
  <a href="hatch.html" class="dock-item"><span class="dock-icon">🥚</span><span class="dock-label">孵蛋</span></a>
  <a href="forum.html" class="dock-item"><span class="dock-icon">💬</span><span class="dock-label">论坛</span></a>
  <a href="shop.html" class="dock-item"><span class="dock-icon">🛍️</span><span class="dock-label">商店</span></a>
  <a href="mine.html" class="dock-item active"><span class="dock-icon">😊</span><span class="dock-label">我的</span></a>
</nav>

<script src="js/theme.js"></script>
<script src="js/setting.js"></script>
</body>
</html>
